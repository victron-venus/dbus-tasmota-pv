name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Run reusable Python CI
        uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@98ef67a92a659c1b4633279961ed2bc704a506e2
        with:
          python-version: '3.11'
